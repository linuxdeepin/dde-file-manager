name: 回收站_suite
app: dde-file-manager
description: ''
module: 回收站
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: true; dde-file-manager --open-home
  wait: 3.0
suites:
- id: fm_trash_navigate_s1
  name: 导航到回收站
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: 回收站
    do: click
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: fm_trash_empty_s1
  name: 清空回收站
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: 回收站
    do: click
  - action: dtk_context_menu
    selector:
      name: side_bar_view
      role: tree
    items:
    - 清空回收站
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
