name: 标题栏_suite
app: dde-file-manager
description: ''
module: 标题栏
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: true; dde-file-manager --open-home
  wait: 3.0
suites:
- id: fm_titlebar_forward_s1
  name: 工具栏前进导航
  description: ''
  tags: []
  steps:
  - action: element_action
    selector:
      name: 前进
    do: click
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: fm_titlebar_new_tab_hotkey_s1
  name: 快捷键新建标签页
  description: ''
  tags: []
  steps:
  - action: keyboard_hot_key
    key: ctrl+t
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
