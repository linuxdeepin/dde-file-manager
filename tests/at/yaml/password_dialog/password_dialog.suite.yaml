name: password_dialog_suite
app: dde-file-manager
module: password_dialog
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_password_dialog_001_s1
  name: 密码确认对话框输入验证
  description: ''
  steps:
  - action: element_action
    selector:
      name: OldPwdEdit
      role: entry
    do: click
  - action: keyboard_type
    selector:
      name: OldPwdEdit
      role: entry
    text: oldpwd_001
  - action: element_action
    selector:
      name: NewPwdEdit
      role: entry
    do: click
  - action: keyboard_type
    selector:
      name: NewPwdEdit
      role: entry
    text: newpwd_002
  - action: element_action
    selector:
      name: RepeatPwdEdit
      role: entry
    do: click
  - action: keyboard_type
    selector:
      name: RepeatPwdEdit
      role: entry
    text: newpwd_002
  assert_steps:
  - action: assert_element
    selector:
      name: SaveBtn
      role: push button
  - action: assert_element
    selector:
      name: CancelBtn
      role: push button
teardown:
- action: session_stop
