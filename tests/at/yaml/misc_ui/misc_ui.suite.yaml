name: misc_ui_suite
app: dde-file-manager
module: misc_ui
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_misc_ui_001_s1
  name: 视图提示消息控件
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: IconButton
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: IconButton
    do: point
  - step_type: action
    action: element_action
    selector:
      name: CloseButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: IconButton
  - step_type: assert
    action: assert_element
    selector:
      name: CloseButton
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CloseButton
- id: suite_misc_ui_002_s1
  name: 桌面图标整理设置对话框
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: point
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Slider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: SwitchBtn
  - step_type: assert
    action: assert_element
    selector:
      name: KeyEdit
      role: text
- id: suite_misc_ui_003_s1
  name: 磁盘托盘提示、桌面水印与属性键值标签
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TextLabel
      role: label
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: TipsLabel
    do: point
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextLabel
    items:
    - 属性
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: RightValueEdit
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: TipsLabel
  - step_type: assert
    action: assert_element
    selector:
      name: RightValueEdit
  - step_type: assert
    action: assert_element
    selector:
      name: RightValueEdit
- id: suite_misc_ui_004_s1
  name: 缩放滑块控件验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: ScaleSlider
      role: slider
    do: focus
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: ScaleSlider
      role: slider
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ScaleSlider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: ItemViewParent
      role: list
- id: suite_misc_ui_005_s1
  name: 开关按钮切换验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: focus
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SwitchBtn
  - step_type: assert
    action: assert_element
    selector:
      name: StatusBar
      role: status bar
- id: suite_misc_ui_006_s1
  name: 恢复开关状态验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: RecSwitch
    do: focus
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: RecSwitch
    do: point
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RecSwitch
  - step_type: assert
    action: assert_element
    selector:
      name: SideBarView
- id: suite_misc_ui_007_s1
  name: 提示编辑框验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TipsEdit
      role: text
    do: focus
    wait: 1.0
  - step_type: action
    action: element_set_value
    selector:
      name: TipsEdit
      role: text
    text: test_tip
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TipsEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: TipsLabel
teardown:
- action: session_stop
