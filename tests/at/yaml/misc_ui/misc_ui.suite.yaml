name: misc_ui_suite
app: dde-file-manager
module: misc_ui
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_misc_ui_001_s1
  name: 视图提示消息控件
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: IconButton
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: IconButton
    do: point
  - step_type: action
    action: element_action
    selector:
      name: CloseButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: IconButton
  - step_type: assert
    action: assert_element
    selector:
      name: CloseButton
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CloseButton
- id: suite_misc_ui_002_s1
  name: 桌面图标整理设置对话框
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: point
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Slider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: SwitchBtn
  - step_type: assert
    action: assert_element
    selector:
      name: KeyEdit
      role: text
- id: suite_misc_ui_003_s1
  name: 磁盘托盘提示、桌面水印与属性键值标签
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TextLabel
      role: label
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: TipsLabel
    do: point
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextLabel
    items:
    - 属性
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: RightValueEdit
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: TipsLabel
  - step_type: assert
    action: assert_element
    selector:
      name: RightValueEdit
  - step_type: assert
    action: assert_element
    selector:
      name: RightValueEdit
- id: suite_misc_ui_004_s1
  name: 菜单与组合框控件
  description: 验证 TextLabel/MenuPtr/ComboBox 交互
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TextLabel
      role: label
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: MenuPtr
      role: menu
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: ComboBox
      role: combo box
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: MenuPtr
      role: menu
  - step_type: assert
    action: assert_element
    selector:
      name: ComboBox
      role: combo box
- id: suite_misc_ui_005_s1
  name: 滑块快捷键与开关控件
  description: 验证 Slider/KeyEdit/SwitchBtn 交互
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Slider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: KeyEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: SwitchBtn
- id: suite_misc_ui_006_s1
  name: 复选框侧边栏与地址栏控件
  description: 验证 CheckBox/Tooltip/SideBarView/AddressBar 交互
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CheckBox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: SideBarView
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: AddressBar
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CheckBox
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: SideBarView
  - step_type: assert
    action: assert_element
    selector:
      name: AddressBar
teardown:
- action: session_stop
