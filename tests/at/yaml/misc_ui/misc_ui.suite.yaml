name: misc_ui_suite
app: dde-file-manager
module: misc_ui
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_misc_ui_001_s1
  name: 视图提示消息控件与对话框关闭
  description: 验证提示消息图标按钮可聚焦与定位，点击关闭按钮后对话框关闭，关闭按钮不再可见
  steps:
  - step_type: action
    action: element_action
    selector:
      name: IconButton
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CloseButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: IconButton
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CloseButton
- id: suite_misc_ui_002_s1
  name: 桌面图标整理滑块与快捷键开关设置
  description: 在桌面图标整理设置对话框中验证图标大小滑块可定位，自动整理开关可切换，快捷键编辑框可聚焦
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Slider
      role: slider
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: SwitchBtn
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: KeyEdit
      role: text
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Slider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: SwitchBtn
  - step_type: assert
    action: assert_element
    selector:
      name: KeyEdit
      role: text
- id: suite_misc_ui_003_s1
  name: 磁盘托盘提示、桌面水印与属性键值标签
  description: 验证磁盘托盘文本标签与提示标签可定位，右键打开属性对话框后验证右侧值编辑框可聚焦
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TextLabel
      role: label
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: TipsLabel
    do: point
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextLabel
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: RightValueEdit
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: TipsLabel
  - step_type: assert
    action: assert_element
    selector:
      name: RightValueEdit
teardown:
- action: session_stop
