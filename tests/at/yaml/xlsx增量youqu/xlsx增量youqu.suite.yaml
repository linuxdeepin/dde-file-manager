name: xlsx增量youqu_suite
app: dde-file-manager
description: 基于 YouQu skill 从 V25 xlsx 增量补充的低风险 AT-SPI 对应用例
module: xlsx增量youqu
tags:
- youqu_increment
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager --open-home >/tmp/dfm_at_youqu_increment.log
    2>&1 & sleep 4; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700 >/tmp/dfm_at_youqu_increment_resize.log
    2>&1 || true'
  wait: 1.0
- action: assert_process_running
  app: dde-file-manager
  wait: 6
suites:
- id: case_1806093
  name: 侧边栏固定目录，内容区域右键切换显示方式
  description: 'xlsx 用例编号: 1806093

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/冒烟用例/左侧栏/地址栏/导航栏(#132297)

    前置条件: 无

    测试步骤:

    1. 打开文管，侧边栏选择一个固定目录(如：视频)

    2. 右键内容区域，右键菜单，"显示方式"选择为"列表模式"

    预期结果:

    1. 文管页面跳转到选中的固定目录

    2. 内容区域变为列表模式'
  tags:
  - '2'
  - youqu_increment
  vars:
    xlsx_id: '1806093'
    case_type: 功能测试
    feature: 侧边栏固定目录视图排序
  steps:
  - action: element_action
    ref: 视频
    do: click
    wait: 1.0
  - action: element_action
    ref: listView_button
    do: click
    wait: 1.0
  assert_steps:
  - &id001
    action: assert_element
    ref: 视频
  - action: assert_element
    ref: listView_button
