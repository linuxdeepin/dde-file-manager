- id: case_1806067
  name: '[052]固定目录顶部排序'
  description: 'xlsx 用例编号: 1873487

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/冒烟用例/左侧栏/地址栏/导航栏(#132297)

    前置条件: 文件夹内有文件，并切换成 列表视图

    测试步骤:

    1. 在各个页面查看标头区域

    （主目录/桌面/视频/音乐/图片/文档/下载）

    2. 再次点击“名称”，查看搜索的文件排序

    3. 在点击“修改时间”，查看系统显示

    4. 再点击“修改时间”，查看搜索的文件排序

    5. 在点击“大小”，查看系统显示

    6. 再点击“大小”，查看搜索的文件排序

    7. 在点击“类型”，查看系统显示

    8. 再点击“类型”，查看搜索的文件排序

    9. 切换目录检查表头

    10. 切换窗口检查表头

    预期结果:

    1. 名称、修改时间、大小、类型

    默认“名称”排序规则进行正序排序

    2. “名称”排序规则改变为反序进行排序

    3. 当前文件夹中的文件会自动按照修改时间正序规则进行排序

    4. 当前文件夹中的文件会自动按照修改时间反序规则进行排序

    5. 当前文件夹中的文件会自动按照大小规则正序进行排序

    6. 当前文件夹中的文件会自动按照大小规则反序进行排序

    7. 当前文件夹中的文件会自动按照类型规则正序进行排序

    8. 当前文件夹中的文件会自动按照类型规则反序进行排序

    9. 排序方式不改变

    10. 排序方式不改变'
  tags:
  - '2'
  - youqu_increment
  vars:
    xlsx_id: '1806067'
    case_type: 功能测试
    feature: 固定目录顶部排序入口
  steps:
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: element_action
    ref: listView_button
    do: click
    wait: 1.0
  assert_steps:
  - &id002
    action: assert_element
    ref: side_bar_view
  - action: assert_element
    ref: listView_button
