name: 预览_suite
app: dde-file-manager
description: 预览模块 AT-SPI 用例
module: 预览
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: 预览_0001_s1
  name: 显示uab包预览
  description: 显示uab包预览
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 文档
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 文档
