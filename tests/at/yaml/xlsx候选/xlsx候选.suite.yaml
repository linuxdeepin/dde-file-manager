name: xlsx候选_suite
app: dde-file-manager
description: '从 V25 xlsx 筛选的低风险 AT-SPI 候选用例：侧边栏固定目录入口'
module: xlsx候选
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: dde-file-manager --open-home
  wait: 5.0
suites:
- id: case_1806345
  name: 侧边栏最近使用，点击进入
  description: '打开文管，侧边栏单击最近使用，验证最近使用入口存在并可进入'
  tags: []
  steps:
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 最近使用
- id: case_1806089
  name: 侧边栏固定目录，点击后跳转
