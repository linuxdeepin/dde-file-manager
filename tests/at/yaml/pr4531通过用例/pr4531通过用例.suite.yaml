name: pr4531通过用例_suite
app: dde-file-manager
description: PR #4531 中单独验证通过的 AT-SPI 用例，避免合入 PR 对现有 tests/at 的覆盖式改动
module: pr4531通过用例
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_pr4531_bug_sidebar_navigate_system
  name: 侧边栏系统导航-计算机到桌面到最近使用
  description: '来源: PR #4531 case_bug_sidebar_navigate_system'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 计算机
    do: click
    wait: 1.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 计算机
  - action: assert_element
    ref: 桌面
  - action: assert_element
    ref: 最近使用
- id: case_pr4531_bug_sidebar_navigate_network_trash
  name: 侧边栏网络与回收站-网络到回收站到系统盘
