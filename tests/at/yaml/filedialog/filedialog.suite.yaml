      name: FileNameEdit
      role: text
    text: document.pdf
  - step_type: action
    action: element_action
    selector:
      name: FileNameLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: FiltersLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: FiltersComboBox
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: CurAcceptButton
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CurRejectButton
      role: push button
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TitleLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: FileNameEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: FileNameLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: FiltersLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: FiltersComboBox
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: CurAcceptButton
  - step_type: assert
    action: assert_element
    selector:
      name: CurRejectButton
      role: push button
