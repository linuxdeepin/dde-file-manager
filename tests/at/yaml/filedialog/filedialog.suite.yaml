name: filedialog_suite
app: dde-file-manager
module: filedialog
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_filedialog_001_s1
  name: 打开文件对话框基本交互
  description: ''
  steps:
  - step_type: action
    action: element_set_value
    selector:
      name: FileNameEdit
      role: text
    text: test.txt
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FileNameLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: FiltersLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: FiltersComboBox
      role: combo box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FiltersComboBox
      role: combo box
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CurAcceptButton
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TitleLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: CurAcceptButton
- id: suite_filedialog_002_s1
  name: 保存文件对话框与取消操作
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TitleLabel
      role: label
    do: focus
    wait: 1.0
  - step_type: action
    action: element_set_value
    selector:
      name: FileNameEdit
      role: text
    text: newfile.txt
  - step_type: action
    action: element_action
    selector:
      name: FileNameEdit
      role: text
    do: focus
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FiltersComboBox
      role: combo box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FiltersLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: CurRejectButton
      role: push button
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CurRejectButton
      role: push button
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CurRejectButton
      role: push button
teardown:
- action: session_stop
