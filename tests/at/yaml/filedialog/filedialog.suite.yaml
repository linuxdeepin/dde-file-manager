  - step_type: action
    action: element_action
    selector:
      name: FileNameLabel
      role: label
    do: point
  - step_type: action
    action: element_action
    selector:
      name: FiltersComboBox
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
