name: search_suite
app: dde-file-manager
module: search
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_search_001_s1
  name: 智能语义搜索-中文数字转换
  description: ''
  steps:
  - step_type: action
    action: session_start
    command: dde-file-manager
    wait: 3.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+l
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: /home
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: 25年十二月创建的表格
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ItemViewParent
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: AddressBar
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: StatusBar
      role: status bar
