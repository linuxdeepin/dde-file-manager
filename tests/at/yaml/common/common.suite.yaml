name: common_suite
app: dde-file-manager
module: common
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_common_001_s1
  name: 光盘烧录选项与镜像转储对话框
  description: 右键文件选择刻录到光盘打开烧录对话框，设置校验/弹出/终结光盘选项并进入高级设置，关闭后再次通过右键打开转换为镜像对话框验证控件
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 刻录到光盘
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CheckdiscCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ChecksumCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: EjectCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: AdvanceBtn
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 转换为镜像
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CreateImgBtn
      role: push button
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CheckdiscCheckbox
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: AdvanceBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: FileChooser
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: CreateImgBtn
      role: push button
- id: suite_common_002_s1
  name: 打开方式选择对话框交互与取消关闭
  description: 右键文件选择打开方式打开对话框，验证选择默认程序按钮与确定/取消按钮可交互，点击取消后对话框关闭
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: ChooseButton
    items:
    - 打开方式
    - 选择默认程序
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CheckButton
      role: push button
    do: focus
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: ChooseButton
      role: push button
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CancelButton
      role: push button
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ChooseButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: CheckButton
      role: push button
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CancelButton
      role: push button
- id: suite_common_003_s1
  name: 文件属性对话框权限管理与标签编辑
  description: 右键文件选择属性打开属性对话框，验证路径编辑框可修改、可执行权限复选框可切换，并通过告警提示验证非法路径输入被拦截
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: CrumbEdit
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CrumbEdit
      role: text
    do: click
  - step_type: action
    action: element_set_value
    selector:
      name: Edit_2
      role: text
    text: /
  - step_type: action
    action: element_action
    selector:
      name: ExecutableCheckBox
      role: check box
    do: click
    wait: 0.5
  - step_type: assert
    action: assert_element
    selector:
      name: AlertTooltip
      role: tool tip
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CrumbEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: ExecutableCheckBox
      role: check box
  - step_type: assert
    action: assert_not_exists
    selector:
      name: ExecutableCheckBox
      role: check box
- id: suite_common_004_s1
  name: 目录共享设置与蓝牙发送设备列表验证
  description: 右键设备列表选择共享文件夹打开共享设置对话框，验证复制网络地址与用户名按钮可用；关闭后再通过右键发送到蓝牙验证设备列表可定位
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: DevicesListView
    items:
    - 共享文件夹
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CopyNetAddr
      role: push button
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: CopyUserNameBt
      role: push button
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: DevicesListView
    items:
    - 发送到
    - 蓝牙
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: DevicesListView
      role: list
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CopyNetAddr
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: CopyUserNameBt
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: DevicesListView
      role: list
