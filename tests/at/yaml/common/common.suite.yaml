name: common_suite
app: dde-file-manager
module: common
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_common_001_s1
  name: 光盘烧录选项与镜像转储对话框
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 刻录到光盘
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CheckdiscCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ChecksumCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: EjectCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: AdvanceBtn
      role: push button
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 转换为镜像
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CreateImgBtn
      role: push button
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CheckdiscCheckbox
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: AdvanceBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: FileChooser
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: CreateImgBtn
      role: push button
- id: suite_common_002_s1
  name: 打开方式对话框
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: ChooseButton
    items:
    - 打开方式
    - 选择默认程序
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CheckButton
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ChooseButton
      role: push button
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CancelButton
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ChooseButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: CheckButton
      role: push button
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CancelButton
      role: push button
- id: suite_common_003_s1
  name: 文件属性对话框（权限管理与标签编辑）
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: CrumbEdit
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CrumbEdit
      role: text
    do: click
  - step_type: action
    action: element_action
    selector:
      name: Edit_2
      role: text
    do: focus
  - step_type: action
    action: element_set_value
    selector:
      name: Edit_2
      role: text
    text: /
  - step_type: action
    action: element_action
    selector:
      name: ExecutableCheckBox
      role: check box
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CrumbEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: AlertTooltip
      role: tool tip
  - step_type: assert
    action: assert_element
    selector:
      name: ExecutableCheckBox
      role: check box
  - step_type: assert
    action: assert_not_exists
    selector:
      name: ExecutableCheckBox
      role: check box
- id: suite_common_004_s1
  name: 目录共享与蓝牙传输对话框
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: DevicesListView
    items:
    - 共享文件夹
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CopyNetAddr
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: CopyUserNameBt
      role: push button
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: DevicesListView
    items:
    - 发送到
    - 蓝牙
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: DevicesListView
      role: list
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: DevicesListView
      role: list
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CopyNetAddr
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: CopyUserNameBt
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: DevicesListView
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: DevicesListView
      role: list
- id: suite_common_005_s1
  name: 打开方式选择对话框
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: OpenWithListWidget
    items:
    - 打开方式
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: OpenWithDialog-QScrollArea
      role: scroll pane
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: OpenWithListWidget
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: OpenWithListWidget
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: OpenWithBtnGroup
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: SetToDefaultCheckBox
      role: check box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: OpenFileChooseButton
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: OpenWithListWidget
- id: suite_common_007_s1
  name: 文件属性对话框-隐藏文件属性设置
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: HideFile_2
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: HideFile
      role: check box
    do: click
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: HideFile_2
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: HideFile_2
      role: check box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: HideFile_2
      role: check box
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: HideFile
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: HideFile_2
      role: check box
- id: suite_common_008_s1
  name: 刻录选项与目录共享设置
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FsComb
    items:
    - 刻录到光盘
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: FsComb
      role: combo box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FsComb
      role: combo box
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: FinalizeDiscCheckbox
      role: check box
    do: click
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FsComb
    items:
    - 共享
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ShareNameEditor
      role: text
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: ShareNameEditor
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: ShareAnonymousSelector
      role: combo box
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: SetPasswordBt
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FinalizeDiscCheckbox
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: ShareNameEditor
      role: text
- id: suite_common_009_s1
  name: 文件夹共享属性设置
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: ShareSwitcher
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ShareSwitcher
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: SharePermissionSelector
      role: combo box
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ShareSwitcher
  - step_type: assert
    action: assert_element
    selector:
      name: SharePermissionSelector
- id: suite_common_010_s1
  name: 文件标签信息展示
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TagLable
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: TagLable
      role: label
    do: point
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TagLable
  - step_type: assert
    action: assert_element
    selector:
      name: TagLeftLable
  - step_type: assert
    action: assert_element
    selector:
      name: ToolTip
- id: suite_common_011_s1
  name: 光盘刻录选项设置
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: VolnameEdit
    items:
    - 发送到光盘
    wait: 2.0
  - step_type: action
    action: element_set_value
    selector:
      name: VolnameEdit
      role: text
    text: MyDisc
  - step_type: action
    action: element_action
    selector:
      name: WritespeedComb
      role: combo box
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VolnameEdit
  - step_type: assert
    action: assert_element
    selector:
      name: WritespeedComb
  - step_type: assert
    action: assert_element
    selector:
      name: VolnameEdit
- id: suite_common_012_s1
  name: ''
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+l
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: /
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: menu
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: OwnerComboBox
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: OwnerComboBox
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: GroupComboBox
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: OtherComboBox
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: NameEditIcon
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager
teardown:
- action: session_stop
