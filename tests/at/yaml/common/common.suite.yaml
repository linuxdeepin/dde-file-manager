name: common_suite
app: dde-file-manager
module: common
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_common_001_s1
  name: 光盘烧录选项与镜像转储对话框
  description: ''
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 刻录到光盘
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CheckdiscCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ChecksumCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: EjectCheckbox
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: AdvanceBtn
      role: push button
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FileChooser
    items:
    - 转换为镜像
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CreateImgBtn
      role: push button
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CheckdiscCheckbox
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      name: AdvanceBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: FileChooser
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: CreateImgBtn
      role: push button
- id: suite_common_002_s1
