name: xlsx场景化补全二_suite
app: dde-file-manager
description: 场景化补全第二批——覆盖复制文件地址、撤销/恢复操作、回收站操作、文件列表分组、文件索引配置、标签页固定等主题，强化真实功能操作与业务结果断言
module: xlsx场景化补全二
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 复制文件地址：本地文件路径复制（8 个原始 ID）──
- id: case_1940085
  name: 【复制文件地址】本地与家目录文件地址复制
  description: 'xlsx 用例编号: 1940085, 1940087, 1940081, 1940211, 1939469, 1940089, 1940107, 1940209'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1940085'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1940085; rm -rf "$base"; mkdir -p "$base"; printf data > "$base/test_copy.txt"; printf data > "$base/.hidden_copy.txt"; printf data > "$base/长文件名测试.txt"; rm -f "$base/PASS_1940085"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1940085.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx场景化补全二/assert_clipboard_contains.py /tmp/dde-at-fixtures/case_1940085/PASS_1940085 test_copy.txt
    wait: 3.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1940085/PASS_1940085
