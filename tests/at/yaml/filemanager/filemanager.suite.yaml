name: filemanager_suite
app: dde-file-manager
module: filemanager
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_filemanager_001_s1
  name: 标题栏标签页管理——新建标签页并验证切换
  description: '通过点击新建标签按钮创建新标签页，验证标签栏出现新标签并可切换'
  steps:
  - step_type: action
    action: element_action
    selector:
      name: AddBtn
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: BottomBar
      role: page tab
    do: focus
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: BottomBar
      role: page tab
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: AddBtn
      role: push button
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: BottomBar
      role: page tab
  - step_type: assert
    action: assert_element
    selector:
      name: AddBtn
      role: push button
- id: suite_filemanager_002_s1
  name: 连接到服务器对话框——打开对话框并验证服务器列表与编码设置
  description: '通过主菜单打开连接到服务器对话框，验证服务器列表和编码下拉框可用'
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 文件
    - 连接到服务器
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CollectionServerView
      role: list
    do: focus
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: CharsetComboBox
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CollectionServerView
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: CharsetComboBox
      role: combo box
