name: filemanager_suite
app: dde-file-manager
module: filemanager
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_filemanager_001_s1
  name: 标题栏标签页新增与底部标签栏验证
  description: 点击新增标签按钮创建新标签页，验证底部标签栏出现且新增按钮持续可用
  steps:
  - step_type: action
    action: element_action
    selector:
      name: AddBtn
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: BottomBar
      role: page tab
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: BottomBar
      role: page tab
  - step_type: assert
    action: assert_element
    selector:
      name: AddBtn
      role: push button
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager
- id: suite_filemanager_002_s1
  name: 连接网络服务器对话框交互
  description: 通过主菜单打开连接到服务器对话框，验证服务器列表与字符集下拉框可用
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 文件
    - 连接到服务器
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CollectionServerView
      role: list
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CharsetComboBox
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CollectionServerView
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: CharsetComboBox
      role: combo box
- id: suite_filemanager_003_s1
  name: 磁盘加密管理对话框参数输入验证
  description: 通过主菜单打开加密管理对话框，验证加密类型选择、密钥输入与导出路径控件可用
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 磁盘
    - 加密管理
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ChgUnlockType
      role: push button
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: EncType
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: Editor_2
      role: text
    do: focus
  - step_type: action
    action: element_set_value
    selector:
      name: EncKeyEdit1
      role: text
    text: MyEncryptionKey
  - step_type: action
    action: element_set_value
    selector:
      name: EncKeyEdit2
      role: text
    text: MyEncryptionKey
  - step_type: action
    action: element_action
    selector:
      name: KeyExportInput
      role: text
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ChgUnlockType
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: EncType
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: Editor_2
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: EncKeyEdit1
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: EncKeyEdit2
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: KeyExportInput
      role: text
- id: suite_filemanager_004_s1
  name: 保险箱创建向导与找回密码控件验证
  description: 通过主菜单进入保险箱创建向导，验证完成按钮、密钥文件路径、保险箱路径与取消按钮等控件可定位
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 保险箱
    - 创建保险箱
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: FinishedBtn
      role: push button
    do: focus
  - step_type: action
    action: dtk_main_menu
    items:
    - 保险箱
    - 找回密码
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: KeyFileEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: FilePathEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: ComboBox
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: CheckBox
      role: check box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: CancelBtn
      role: push button
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FinishedBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: KeyFileEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: FilePathEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: ComboBox
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: CheckBox
      role: check box
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CancelBtn
      role: push button
- id: suite_filemanager_005_s1
  name: 标题栏返回导航与文件视图右键菜单
  description: 验证返回按钮可导航后退，占位控件可定位，右键菜单可弹出并关闭
  steps:
  - step_type: action
    action: element_action
    selector:
      name: LeftBtn
      role: push button
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: LeftBtn
      role: push button
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: Placeholder
    do: point
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Placeholder
    items:
    - 属性
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LeftBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: Placeholder
  - step_type: assert
    action: assert_not_exists
    selector:
      name: MenuPtr
      role: menu
- id: suite_filemanager_006_s1
  name: 保险箱创建向导与解锁密码设置流程
  description: 通过主菜单进入保险箱创建向导，验证下一步按钮、密码输入框与密码提示输入框可用
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 保险箱
    - 创建保险箱
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: NextBtn
      role: push button
    do: focus
  - step_type: action
    action: element_set_value
    selector:
      name: PasswordEdit
    text: VaultPass123
  - step_type: action
    action: dtk_main_menu
    items:
    - 保险箱
    - 重置密码
    wait: 2.0
  - step_type: action
    action: element_set_value
    selector:
      name: OldPasswordEdit
    text: OldVaultPass
  - step_type: action
    action: element_set_value
    selector:
      name: NewPasswordEdit
    text: NewVaultPass
  - step_type: action
    action: element_set_value
    selector:
      name: PasswordHintEdit
      role: text
    text: 我的密码提示
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: NextBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: PasswordEdit
  - step_type: assert
    action: assert_element
    selector:
      name: OldPasswordEdit
  - step_type: assert
    action: assert_element
    selector:
      name: NewPasswordEdit
  - step_type: assert
    action: assert_element
    selector:
      name: PasswordHintEdit
      role: text
- id: suite_filemanager_007_s1
