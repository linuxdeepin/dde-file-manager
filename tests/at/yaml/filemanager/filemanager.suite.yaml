  - step_type: assert
    action: assert_element
    selector:
      name: OldPass
  - step_type: assert
    action: assert_element
    selector:
      name: NewPass1
  - step_type: assert
    action: assert_element
    selector:
      name: NewPass2
- id: suite_filemanager_008_s1
