- id: 命令方式_0001_s1
  name: 长文件名功能 -  添加单个角标
  description: 长文件名功能 -  添加单个角标
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 桌面
