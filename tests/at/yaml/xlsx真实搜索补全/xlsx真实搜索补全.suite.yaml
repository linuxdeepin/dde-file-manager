  description: 'xlsx 用例编号: 1878211；创建长名称目录和包含该名称的文本文件，通过文件管理器搜索框搜索长名称，并断言结果包含目录和文本文件。'
  tags:
  - P0-2
  - strict
  vars:
    xlsx_id: '1878211'
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1878211; name=longname_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa; rm -rf "$base"; mkdir -p "$base/$name"; printf "%s\n" "$name" > "$base/a-test.txt"; rm -f "$base/PASS_1878211"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1878211.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: session_start
    command: python3 tests/at/yaml/xlsx真实搜索补全/search_and_mark.py /tmp/dde-at-fixtures/case_1878211/PASS_1878211 longname_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa longname_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa a-test.txt
    wait: 7.0
  assert_steps:
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1878211/PASS_1878211
