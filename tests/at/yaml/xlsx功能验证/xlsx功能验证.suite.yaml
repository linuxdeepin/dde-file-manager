  description: 进入主目录，点击视图按钮，切换列表视图，再切换树形视图
  tags: []
  steps:
  - action: element_action
    ref: listView_button
    do: click
    wait: 1.0
  - action: element_action
    ref: treeView_button
    do: click
    wait: 1.0
  - action: element_action
    ref: iconView_button
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: iconView_button
- id: case_1816699
