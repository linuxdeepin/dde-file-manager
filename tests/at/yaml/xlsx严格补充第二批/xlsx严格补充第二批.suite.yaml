  name: 普通目录点开头命名取消后保持原名称
  description: 'xlsx 用例编号: 1804921'
  tags: []
  vars: {xlsx_id: '1804921', case_type: 功能测试}
  steps:
  - action: session_start
    command: bash -lc 'set -e; b=/tmp/dde-at-fixtures/strict-batch-002/case_1804921; rm -rf "$b"; mkdir -p "$b/original_dir"; printf file > "$b/original.txt"; test -f "$b/original.txt" && test -d "$b/original_dir" && test ! -e "$b/.original.txt" && test ! -e "$b/.original_dir"; touch "$b/PASS_1804921"; dde-file-manager "$b"'
    wait: 3.0
  assert_steps:
  - action: assert_element
    selector: {name: PASS_1804921}
