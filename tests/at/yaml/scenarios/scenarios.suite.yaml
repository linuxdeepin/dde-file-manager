name: scenarios_suite
app: dde-file-manager
module: scenarios
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
# ── 历史导航：后退/前进 (xlsx 1805091, 1805093, 1805095, 1808013) ──
- id: suite_scenarios_001_s1
  name: 历史导航-后退与前进
  description: '覆盖 xlsx 1805091/1805093/1805095/1808013：进入子目录后点后退回到上级，再点前进恢复子目录'
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+l
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: /tmp
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: LeftBtn
      role: push button
    do: click
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      name: LeftBtn
      role: push button
    do: click
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LeftBtn
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: CrumbEdit
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager

# ── 视图模式切换 (xlsx 1816683, 1805207) ──
- id: suite_scenarios_002_s1
  name: 视图模式切换-图标/列表/树形
  description: '覆盖 xlsx 1816683/1805207：通过快捷键切换图标视图→列表视图→树形视图，每次验证视图区域存在'
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+1
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+2
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+3
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+1
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CollectionView
  - step_type: assert
    action: assert_element
    selector:
      name: ScrollArea
      role: scroll pane
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager

# ── 搜索功能 (xlsx 1816683, 1816685, 1816687) ──
- id: suite_scenarios_003_s1
  name: 搜索-输入关键词与清空
  description: '覆盖 xlsx 1816683/1816685/1816687：打开搜索框输入关键词，验证搜索激活后清空搜索框'
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: test
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: f
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CollectionView
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager

# ── 标签页管理 (xlsx 1935223, 1936025, 1964025) ──
- id: suite_scenarios_004_s1
  name: 标签页-新建切换与关闭
  description: '覆盖 xlsx 1935223/1936025/1964025：新建标签页，验证标签栏存在，关闭标签页回到原标签'
  steps:
  - step_type: action
    action: element_action
    selector:
      name: AddBtn
      role: push button
    do: click
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      name: BottomBar
      role: page tab
    do: focus
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+w
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TabBar
      role: page tab
  - step_type: assert
    action: assert_element
    selector:
      name: AddBtn
      role: push button
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager

# ── 右键空白处菜单 (xlsx 1806061, 1807651) ──
- id: suite_scenarios_005_s1
  name: 右键空白处-新建文件夹与排序
  description: '覆盖 xlsx 1806061/1807651：在文件视图空白处右键，选择新建文件夹，验证新建文件夹后右键排序'
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: CollectionView
    items:
    - 新建文件夹
    wait: 2.0
  - step_type: action
    action: keyboard_type_text
    text: at_test_folder
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: CollectionView
    items:
    - 排序
    - 按名称
    wait: 2.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+z
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CollectionView
  - step_type: assert
    action: assert_window
    selector:
      name: dde-file-manager

