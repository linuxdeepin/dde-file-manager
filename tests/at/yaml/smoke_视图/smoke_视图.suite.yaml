    do: right_click
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: ToggleModeBtn
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
