  description: '来源用例编号: 1998519'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: 主目录
    do: right_click
    wait: 1.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: element_action
    ref: 回收站
    do: right_click
    wait: 1.0
