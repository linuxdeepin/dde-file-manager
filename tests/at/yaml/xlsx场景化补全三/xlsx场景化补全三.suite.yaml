name: xlsx场景化补全三_suite
app: dde-file-manager
description: 场景化补全第三批——覆盖搜索黑名单、右键新建、长文件名、文件集合编辑、快捷键帮助、标签页右键固定、拖拽边缘滚动、文件列表分组、固定标签页设置、新标签页打开文件夹、同类型聚合排序、智能语义搜索类型/位置槽、复制文件地址等主题
module: xlsx场景化补全三
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 搜索黑名单配置：黑名单路径下文件搜索（3 个原始 ID）──
- id: case_1972333
  name: 【搜索黑名单】黑名单路径下新增/修改文件再搜索
  description: 'xlsx 用例编号: 1972333, 1972325, 1972321'
  tags:
  - P2
  - strict
  vars: {xlsx_id: '1972333'}
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1972333; rm -rf "$base"; mkdir -p "$base/black-path"; printf "测试搜索黑名单路径" > "$base/black-path/new-file.txt"; printf "测试搜索黑名单路径" > "$base/black-path/black-path-1.txt"; rm -f "$base/PASS_1972333"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1972333.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1972333; test -f "$base/black-path/new-file.txt"; test -f "$base/black-path/black-path-1.txt"; touch "$base/PASS_1972333"'
    wait: 2.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1972333/PASS_1972333
