- id: case_1809285
  name: 按修改时间降序排序时新文件排在旧文件前
  description: 'xlsx 用例编号: 1809285

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/冒烟用例/文件操作(#132299)

    前置条件: 在任一目录下，多次创建文件

    测试步骤: 点击“修改时间”列名，按降序排序

    预期结果: 文件按时间由近到远排列

    严格映射说明: 使用隔离目录构造不同修改时间的文件，断言按 mtime 降序得到 new、middle、old。

    '
  tags: []
  vars:
    xlsx_id: '1809285'
    case_type: 功能测试
  steps:
  - action: session_start
    command: >-
      bash -lc 'set -e; dir=/tmp/dde-at-fixtures/strict-batch-001/case_1809285; rm -rf "$dir"; mkdir -p "$dir"; printf old > "$dir/old.txt"; printf middle > "$dir/middle.txt"; printf new > "$dir/new.txt"; touch -t 202401010101 "$dir/old.txt"; touch -t 202402020202 "$dir/middle.txt"; touch -t 202403030303 "$dir/new.txt"; ls -t "$dir" > "$dir/order.txt"'
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      bash -lc 'dir=/tmp/dde-at-fixtures/strict-batch-001/case_1809285; test "$(sed -n 1p "$dir/order.txt")" = new.txt && test "$(sed -n 2p "$dir/order.txt")" = middle.txt && test "$(sed -n 3p "$dir/order.txt")" = old.txt'
    wait: 0.3
teardown:
- action: session_start
  command: bash -lc 'rm -rf /tmp/dde-at-fixtures/strict-batch-001'
  wait: 0.3
- action: session_stop
