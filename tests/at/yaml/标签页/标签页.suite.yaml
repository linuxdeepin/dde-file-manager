  description: 检查文管-列表模式-留白处右键菜单功能遍历正常
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  - action: element_action
    ref: 主目录
    do: click
    wait: 1.0
  - action: element_action
    ref: 音乐
