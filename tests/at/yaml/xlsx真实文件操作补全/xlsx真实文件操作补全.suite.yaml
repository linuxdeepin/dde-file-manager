name: xlsx真实文件操作补全_suite
app: dde-file-manager
description: 使用真实文件管理器交互补全 xlsx 文件操作缺口，仅保留本地运行通过的用例
module: xlsx真实文件操作补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
- id: case_1939833
  name: 【复制文件地址】树形视图_批量复制完整路径
  description: 'xlsx 用例编号: 1939833；创建 100 个多类型条目，切换树形视图后全选并复制文件地址，逐条校验剪贴板中的完整路径。'
  tags:
  - P0-1
  - strict
  vars:
    xlsx_id: '1939833'
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1939833; rm -rf "$base"; mkdir -p "$base"; for i in $(seq -w 1 20); do touch "$base/text_${i}.txt" "$base/image_${i}.jpg" "$base/document_${i}.pdf" "$base/script_${i}.sh"; mkdir "$base/folder_${i}"; done; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1939833.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+3
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx真实文件操作补全/assert_clipboard_paths.py /tmp/dde-at-fixtures/case_1939833
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1939833/PASS_1939833
- id: case_1804813
  name: 扩展名隐藏后复制文件路径仍为完整路径
  description: 'xlsx 用例编号: 1804813；关闭“显示文件扩展名”配置后选中文件复制地址，校验剪贴板中的完整路径仍包含真实扩展名。'
  tags:
  - P0-1
  - strict
  vars:
    xlsx_id: '1804813'
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1804813; cfg="$HOME/.config/deepin/dde-file-manager.json"; backup=/tmp/dfm_at_1804813_config_backup.json; rm -rf "$base"; mkdir -p "$base"; printf "case 1804813\n" > "$base/hidden_suffix_path.txt"; cp "$cfg" "$backup" 2>/dev/null || printf "{}\n" > "$backup"; python3 - <<"PY"
      import json
      from pathlib import Path
      cfg = Path.home() / ".config/deepin/dde-file-manager.json"
      cfg.parent.mkdir(parents=True, exist_ok=True)
      data = json.loads(cfg.read_text(encoding="utf-8")) if cfg.exists() else {}
      data.setdefault("GenericAttribute", {})["ShowedFileSuffix"] = False
      cfg.write_text(json.dumps(data, ensure_ascii=False, indent=4) + "\n", encoding="utf-8")
      PY
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1804813.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1000 650'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+shift+c
    wait: 1.0
  assert_steps:
  - action: session_start
    command: python3 tests/at/yaml/xlsx真实文件操作补全/assert_clipboard_single_path.py /tmp/dde-at-fixtures/case_1804813/hidden_suffix_path.txt /tmp/dde-at-fixtures/case_1804813/PASS_1804813
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1804813/PASS_1804813
