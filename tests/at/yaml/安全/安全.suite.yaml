name: 安全_suite
app: dde-file-manager
description: 安全模块 AT-SPI 用例
module: 安全
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: 安全_0001_s1
  name: 【文管安全性】界面静置场景内存泄漏监测
  description: 【文管安全性】界面静置场景内存泄漏监测
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: 安全_0002_s1
  name: 【文管安全性】包安全编译选项检查
  description: 【文管安全性】包安全编译选项检查
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
- id: 安全_0003_s1
  name: 中间人攻击 (MITM)
  description: 中间人攻击 (MITM)
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 网络
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 网络
- id: 安全_0004_s1
  name: 确保传输中的数据通过适当的加密机制保护
  description: 确保传输中的数据通过适当的加密机制保护
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 网络
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 网络
teardown:
- action: session_stop
