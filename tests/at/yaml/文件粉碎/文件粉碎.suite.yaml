name: 文件粉碎_suite
app: dde-file-manager
description: 文件粉碎模块 AT-SPI 用例
module: 文件粉碎
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: 文件粉碎_0001_s1
  name: 【文件粉碎】粉碎大量文件时，有部分文件粉碎失败
  description: 【文件粉碎】粉碎大量文件时，有部分文件粉碎失败
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 最近使用
- id: 文件粉碎_0002_s1
  name: 【文件粉碎】文件粉碎过程中同时做其他操作
  description: 【文件粉碎】文件粉碎过程中同时做其他操作
