name: file_preview_suite
app: dde-file-manager
module: file_preview
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_file_preview_001_s1
  name: 预览对话框导航按钮验证
  description: ''
  steps: []
  assert_steps:
  - action: assert_element
    selector:
      name: OpenBtn
      role: push button
  - action: assert_element
    selector:
      name: CloseBtn
      role: push button
  - action: assert_element
    selector:
      name: NextBtn
      role: push button
  - action: assert_element
    selector:
      name: PreBtn
      role: push button
- id: suite_file_preview_002_s1
  name: DCI图标预览控件验证
  description: ''
  steps: []
  assert_steps:
  - action: assert_element
    selector:
      name: AvailableSizeCombo
      role: combo box
  - action: assert_element
    selector:
      name: ThemeCom
      role: combo box
  - action: assert_element
    selector:
      name: ModeCom
      role: combo box
  - action: assert_element
    selector:
      name: CustomSizeEdit
      role: entry
  - action: assert_element
    selector:
      name: ForegroundPaletteEdit
      role: entry
  - action: assert_element
    selector:
      name: BackgroundPaletteEdit
      role: entry
  - action: assert_element
    selector:
      name: HFpaletteEdit
      role: entry
  - action: assert_element
    selector:
      name: HightlightPaletteEdit
      role: entry
- id: suite_file_preview_003_s1
  name: 视频预览播放控件验证
  description: ''
  steps: []
  assert_steps:
  - action: assert_element
    selector:
      name: PlayControlButton
      role: push button
  - action: assert_element
    selector:
      name: ProgressSlider
      role: slider
  - action: assert_element
    selector:
      name: ControlButton
      role: push button
teardown:
- action: session_stop
