name: xlsx搜索扩展_suite
app: dde-file-manager
description: 从 V25 xlsx 映射的搜索和视图扩展用例：输入原始搜索关键词并验证文管保持可用
module: xlsx搜索扩展
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager --open-home >/tmp/dfm_at_search_normal.log
    2>&1 & sleep 4; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700 >/tmp/dfm_at_search_normal_resize.log
    2>&1 || true'
  wait: 1.0
- action: assert_process_running
  app: dde-file-manager
  wait: 6
- action: keyboard_hot_key
  key: ctrl+f
  wait: 1.0
suites:
- id: case_2002023
  name: 【全局搜索-图片文本内容搜索】关键词命中多行OCR文本时，仅展示第1行
  description: 在搜索框输入 xlsx 原始关键词「最长显示255」，验证文管不崩溃
  tags: []
  steps:
  - action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.2
  - action: keyboard_type
    text: 最长显示255
    wait: 2.0
  assert_steps:
  - action: assert_element
    ref: side_bar_view
