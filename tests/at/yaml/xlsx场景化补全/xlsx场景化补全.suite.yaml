  - action: keyboard_hot_key
    key: ctrl+h
    wait: 1.0
  assert_steps:
  - action: session_start
    command: bash -lc 'set -e; cfg="$HOME/.config/deepin/dde-file-manager.json"; val=$(python3 -c "import json; d=json.load(open(\"$cfg\")); print(d.get(\"GenericAttribute\",{}).get(\"ShowedFileSuffix\"))"); test "$val" = "True"; touch /tmp/dde-at-fixtures/case_1804809/PASS_1804809'
