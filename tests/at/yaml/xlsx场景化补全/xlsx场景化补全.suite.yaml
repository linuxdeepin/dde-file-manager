  - strict
  vars: {xlsx_id: '1804809'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1804809; cfg="$HOME/.config/deepin/dde-file-manager.json"; backup=/tmp/dfm_at_1804809_config_backup.json; rm -rf "$base"; mkdir -p "$base/.hidden_dir"; printf hidden > "$base/.hidden_file"; printf visible > "$base/visible.txt"; printf test > "$base/archive.tar.gz"; cp "$cfg" "$backup" 2>/dev/null || printf "{}\n" > "$backup"; python3 tests/at/yaml/xlsx真实文件操作补全/set_dfm_json_bool.py GenericAttribute ShowedFileSuffix true /tmp/dfm_at_1804809_suffix_backup.json; python3 tests/at/yaml/xlsx真实文件操作补全/set_dfm_json_bool.py GenericAttribute ShowedHiddenFiles true /tmp/dfm_at_1804809_hidden_backup.json; rm -f "$base/PASS_1804809"; pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager "$base" >/tmp/dfm_at_1804809.log 2>&1 & sleep 5; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
