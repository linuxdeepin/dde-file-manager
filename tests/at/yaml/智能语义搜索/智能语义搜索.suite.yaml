name: 智能语义搜索_suite
app: dde-file-manager
description: 从 V25 xlsx 映射的智能语义搜索用例：进入目录后输入真实语义关键词并验证文管不崩溃
module: 智能语义搜索
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true; dde-file-manager --open-home >/tmp/dfm_at_search_normal.log
    2>&1 & sleep 4; xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700 >/tmp/dfm_at_search_normal_resize.log
    2>&1 || true'
  wait: 1.0
- action: assert_process_running
  app: dde-file-manager
  wait: 6
- action: keyboard_hot_key
  key: ctrl+f
  wait: 1.0
suites:
- id: case_2019737
  name: 【智能语义搜索】类型槽-设计源文件，搜索指定后缀文件
  description: 进入桌面，在搜索框输入语义关键词「文档目录里的sketch文件」，验证文管不崩溃
  tags: []
  steps:
  - action: element_action
    ref: 桌面
    do: click
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_type
    text: 文档目录里的sketch文件
    wait: 3.0
  assert_steps:
  - action: assert_element
    ref: side_bar_view
