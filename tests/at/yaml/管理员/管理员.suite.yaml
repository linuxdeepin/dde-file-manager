name: 管理员_suite
app: dde-file-manager
description: '管理员模块 AT-SPI 用例：侧边栏导航项多级切换与主菜单设置场景'
module: 管理员
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_admin_sidebar_navigate_personal
  name: 侧边栏个人目录导航——桌面到文档到最近使用
  description: '依次点击桌面、文档、最近使用导航项，验证每次切换后导航项均可访问'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: element_action
    ref: 文档
    do: click
    wait: 1.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 桌面
  - action: assert_element
    ref: 文档
  - action: assert_element
    ref: 最近使用
- id: case_admin_sidebar_navigate_media
  name: 侧边栏媒体目录导航——视频与快捷访问
  description: '点击视频导航项切换到视频目录，再切换到快捷访问，验证导航项均存在'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 视频
    do: click
    wait: 1.0
  - action: element_action
    ref: 快捷访问
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 视频
  - action: assert_element
    ref: 快捷访问
- id: case_admin_menu_settings
  name: 主菜单——打开设置对话框并验证进程运行
  description: '通过主菜单打开设置对话框，验证文件管理器进程持续运行'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: dtk_main_menu
    ref: 设置
    items:
    - 设置
    wait: 2.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
