name: 管理员_suite
app: dde-file-manager
description: '管理员模块 AT-SPI 用例：侧边栏导航项及主菜单交互'
module: 管理员
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_admin_sidebar_desktop
  name: 侧边栏导航-桌面
  description: '验证侧边栏"桌面"导航项存在并可点击'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 桌面
- id: case_admin_sidebar_documents
  name: 侧边栏导航-文档
  description: '验证侧边栏"文档"导航项存在并可点击'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 文档
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 文档
- id: case_admin_sidebar_recent
  name: 侧边栏导航-最近使用
  description: '验证侧边栏"最近使用"导航项存在并可点击'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 最近使用
- id: case_admin_sidebar_videos
  name: 侧边栏导航-视频
  description: '验证侧边栏"视频"导航项存在并可点击'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 视频
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 视频
- id: case_admin_sidebar_quick_access
  name: 侧边栏导航-快捷访问
  description: '验证侧边栏"快捷访问"导航项存在并可点击'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 快捷访问
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 快捷访问
- id: case_admin_menu_settings
  name: 主菜单-设置
  description: '通过主菜单打开设置对话框'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: dtk_main_menu
    ref: 设置
    items:
    - 设置
    wait: 2.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
