name: bug转用例场景_suite
app: dde-file-manager
description: 'bug转用例场景模块 AT-SPI 用例：侧边栏设备与网络导航、主菜单操作场景'
module: bug转用例场景
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_bug_sidebar_navigate_system
  name: 侧边栏系统导航——计算机到桌面到最近使用
  description: '依次点击计算机、桌面、最近使用导航项，验证每次切换后导航项均可访问'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 计算机
    do: click
    wait: 1.0
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 计算机
  - action: assert_element
    ref: 桌面
  - action: assert_element
    ref: 最近使用
- id: case_bug_sidebar_navigate_network_trash
  name: 侧边栏网络与回收站——网络到回收站到系统盘
  description: '依次点击网络、回收站、系统盘导航项，验证导航项存在且可点击切换'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 网络
    do: click
    wait: 1.0
  - action: element_action
    ref: 回收站
    do: click
    wait: 1.0
  - action: element_action
    ref: 系统盘
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 网络
  - action: assert_element
    ref: 回收站
  - action: assert_element
    ref: 系统盘
- id: case_bug_sidebar_navigate_pictures
  name: 侧边栏图片目录导航
  description: '点击图片导航项切换到图片目录，验证导航项存在且可访问'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: 图片
    do: click
    wait: 1.0
  assert_steps:
  - action: assert_element
    ref: 图片
- id: case_bug_menu_settings_and_new_window
  name: 主菜单——设置与新建窗口操作
  description: '通过主菜单打开设置对话框，关闭后通过主菜单新建窗口，验证文件管理器进程持续运行'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: dtk_main_menu
    ref: 设置
    items:
    - 设置
    wait: 2.0
  - action: keyboard_press
    key: escape
    wait: 1.0
  - action: dtk_main_menu
    ref: 新建窗口
    items:
    - 新建窗口
    wait: 2.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
teardown:
- action: session_stop
