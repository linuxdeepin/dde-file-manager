name: 保险箱_suite
app: dde-file-manager
description: 保险箱模块 AT-SPI 用例
module: 保险箱
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_smoke_保险箱_001
  name: 保险箱内各菜单功能检查-新建文件
  description: '来源用例编号: 1970083'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: keyboard_press
    key: Menu
    wait: 1.0
  - action: dtk_context_menu
    selector:
      name: 主目录
    items:
    - 新建文件夹
    wait: 2.0
  - action: dtk_context_menu
    selector:
      name: 主目录
    items:
    - 刷新
    wait: 2.0
  assert_steps:
  - action: assert_element
    ref: 文档
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_process_running
    app: dde-file-manager
