name: xlsx批次二场景化补全_suite
app: dde-file-manager
description: >-
  批次二 P3 主题场景化补全——将智能语义搜索类型全覆盖、文件列表分组排序、彻底删除空间不足、
  回收站还原大文件、最近使用属性排序、高级搜索范围与大小、文件系统类型搜索、文件索引配置、
  外设托盘挂载、固定标签页自定义目录、同类型聚合排序、计算机页面操作、文件选择对话框、
  剪切拷贝进度弹窗、桌面文件管理快捷方式、桌面整理集合翻页、图片文本内容搜索、新标签页打开、
  dock磁盘插件、本地磁盘隐藏、文件属性隐藏配置、ELF文件可执行权限、兼容菜单翻译率、
  搜索专项优化索引隐藏、顶部右键窗口置顶、复制文件地址软硬链接、外设实时同步默认值、
  新建office文档属性、主目录图标多用户、侧边栏快捷访问、组策略磁盘隐藏、文件右键打开方式、
  书签用户隔离、多类型文件回车打开、升级安装终端安装、历史导航面包屑变化 36 个主题块
  （87 个原始 ID）从入口烟测强化为真实功能操作+业务结果断言。
module: xlsx批次二场景化补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 5. 智能语义搜索：类型全覆盖与默认值（2 ID）──
# 2018553, 2019285
- id: case_2018553
  name: 【智能语义搜索】类型全覆盖与默认值恢复
  description: 'xlsx 用例编号: 2018553, 2019285；准备全部支持类型文件，搜索验证命中结果，检查并恢复默认值。'
  tags:
  - P3
  - strict
  vars: {xlsx_id: '2018553'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_2018553; rm -rf "$base"; mkdir -p "$base";
      for ext in txt docx xlsx pptx pdf mp4 mp3 zip deb png jpg html csv json; do printf "data" > "$base/file.$ext"; done;
      rm -f "$base/PASS_2018553";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_2018553.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_type
    text: file
    wait: 2.0
  - action: keyboard_hot_key
    key: Escape
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次二场景化补全/assert_batch2.py
      /tmp/dde-at-fixtures/case_2018553/PASS_2018553
      file_count
      /tmp/dde-at-fixtures/case_2018553
      13
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_2018553/PASS_2018553
