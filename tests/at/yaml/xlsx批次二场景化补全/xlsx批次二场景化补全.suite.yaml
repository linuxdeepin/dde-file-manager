name: xlsx批次二场景化补全_suite
app: dde-file-manager
description: >-
  新基线适用且本地通过的批次二场景化补全，覆盖文件列表分组、回收站、最近使用、
  搜索、索引、固定标签页、计算机、文件选择、桌面管理、图片文本搜索、磁盘、文件属性、
  权限、右键、书签和升级等 23 个主题块（37 个原始 ID）。
module: xlsx批次二场景化补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 6. 文件列表支持分组：排序与目录范围（8 ID）──
# 1936479, 1936483, 1936503, 1936509, 1936527, 1936529, 1936549, 1936551
- id: case_1936479
  name: 【文件列表支持分组】分组排序与目录范围
  description: 'xlsx 用例编号: 1936479, 1936483, 1936509, 1936529, 1936549, 1936551；列表视图分组按名称/时间/大小/类型排序，各目录及对话框分组正常。'
  tags:
  - P3
  - strict
  vars: {xlsx_id: '1936479'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1936479; rm -rf "$base"; mkdir -p "$base/sub_dir";
      printf "aaa" > "$base/alpha.txt";
      printf "bbbb" > "$base/beta.log";
      printf "cccccc" > "$base/gamma.png";
      printf "dddddddd" > "$base/delta.docx";
      touch -t 202401010101 "$base/alpha.txt";
      touch -t 202406060606 "$base/beta.log";
      touch -t 202403030303 "$base/gamma.png";
      touch -t 202412121212 "$base/delta.docx";
      rm -f "$base/PASS_1936479";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_1936479.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+2
    wait: 1.0
  - action: element_action
    ref: ToggleModeBtn
    do: click
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次二场景化补全/assert_batch2.py
      /tmp/dde-at-fixtures/case_1936479/PASS_1936479
      exists
      /tmp/dde-at-fixtures/case_1936479/alpha.txt
      /tmp/dde-at-fixtures/case_1936479/beta.log
      /tmp/dde-at-fixtures/case_1936479/gamma.png
      /tmp/dde-at-fixtures/case_1936479/delta.docx
      /tmp/dde-at-fixtures/case_1936479/sub_dir
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1936479/PASS_1936479
