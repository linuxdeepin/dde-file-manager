name: dde_file_manager_preview_suite
app: dde-file-manager
module: dde_file_manager_preview
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_dde_file_manager_preview_001_s1
  name: 未知类型文件预览与对话框关闭
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: CloseBtn
      role: push button
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CloseBtn
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: IconLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: NameLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: CloseBtn
      role: push button
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CloseBtn
      role: push button
- id: suite_dde_file_manager_preview_002_s1
  name: 音乐文件预览信息展示
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ArtistValue
      role: label
    do: focus
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ArtistLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: ArtistValue
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: AlbumLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: AlbumValue
      role: label
  - step_type: assert
    action: assert_not_exists
    selector:
      name: ArtistLabel
      role: label
- id: suite_dde_file_manager_preview_003_s1
  name: DCI 图标预览模式与调色板设置
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ModeCom
      role: combo box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: AvailableSizeCombo
      role: combo box
    do: click
  - step_type: action
    action: element_set_value
    selector:
      name: CustomSizeEdit
      role: text
    text: '64'
  - step_type: action
    action: element_set_value
    selector:
      name: ForegroundPaletteEdit
      role: text
    text: '0'
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ModeCom
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: AvailableSizeCombo
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: CustomSizeEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: ForegroundPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: BackgroundPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: HightlightPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: HFpaletteEdit
      role: text
- id: suite_dde_file_manager_preview_004_s1
  name: 视频预览播放控制与翻页切换 PDF 缩略图
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ControlButton
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ControlButton
      role: push button
    do: focus
  - step_type: action
    action: keyboard_press
    key: right
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      name: ItemViewParent
      role: list
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ControlButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ItemViewParent
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: ItemViewParent
      role: list
- id: suite_dde_file_manager_preview_005_s1
  name: 音乐与视频文件预览及播放控制
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/sounds
  - step_type: action
    action: keyboard_press
    key: enter
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: PlayControlButton
      role: push button
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share
  - step_type: action
    action: keyboard_press
    key: enter
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: StatusBar
      role: status bar
  - step_type: assert
    action: assert_element
    selector:
      name: PlayControlButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ProgressSlider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: Slider_2
      role: slider
- id: suite_dde_file_manager_preview_006_s1
  name: PDF加密预览翻页与未知文件信息显示
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/doc
  - step_type: action
    action: keyboard_press
    key: enter
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Nextbutton
      role: push button
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: View_ImageList
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: Nextbutton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: SizeLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: TypeLabel
      role: label
- id: suite_dde_file_manager_preview_007_s1
  name: DCI图标预览主题切换
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/dsg/icons
  - step_type: action
    action: keyboard_press
    key: enter
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ThemeCom
      role: combo box
    do: click
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: action
    action: keyboard_press
    key: enter
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ThemeCom
      role: combo box
teardown:
- action: session_stop
