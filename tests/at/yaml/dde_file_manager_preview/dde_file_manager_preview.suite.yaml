name: dde_file_manager_preview_suite
app: dde-file-manager
module: dde_file_manager_preview
setup:
- action: session_start
  command: dde-file-manager
  wait: 3.0
suites:
- id: suite_dde_file_manager_preview_001_s1
  name: 未知类型文件预览信息展示与对话框关闭
  description: 选中未知类型文件按空格键打开预览面板，验证文件图标与名称标签正确显示，点击关闭按钮后面板消失
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: IconLabel
      role: label
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: CloseBtn
      role: push button
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: IconLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: NameLabel
      role: label
  - step_type: assert
    action: assert_not_exists
    selector:
      name: CloseBtn
      role: push button
- id: suite_dde_file_manager_preview_002_s1
  name: 音乐文件预览元数据信息展示与关闭
  description: 选中音乐文件按空格键打开预览面板，验证艺术家与专辑标签及对应值正确显示，按Escape关闭后预览面板消失
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ArtistValue
      role: label
    do: focus
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ArtistLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: ArtistValue
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: AlbumLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: AlbumValue
      role: label
  - step_type: assert
    action: assert_not_exists
    selector:
      name: ArtistLabel
      role: label
- id: suite_dde_file_manager_preview_003_s1
  name: DCI 图标预览模式切换与调色板参数设置
  description: 选中DCI图标文件按空格键打开预览面板，切换预览模式与可用尺寸，设置自定义尺寸与前景/背景/高亮/高亮前景调色板值
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ModeCom
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: AvailableSizeCombo
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: element_set_value
    selector:
      name: CustomSizeEdit
      role: text
    text: '64'
  - step_type: action
    action: element_set_value
    selector:
      name: ForegroundPaletteEdit
      role: text
    text: '0'
  - step_type: action
    action: element_action
    selector:
      name: BackgroundPaletteEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: HightlightPaletteEdit
      role: text
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: HFpaletteEdit
      role: text
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ModeCom
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: AvailableSizeCombo
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      name: CustomSizeEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: ForegroundPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: BackgroundPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: HightlightPaletteEdit
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: HFpaletteEdit
      role: text
- id: suite_dde_file_manager_preview_004_s1
  name: 视频预览播放控制与翻页切换
  description: 选中视频文件按空格键打开预览面板，点击播放控制按钮启停播放，按右方向键翻页并验证文件列表视图可定位
  steps:
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ControlButton
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: right
    wait: 1.5
  - step_type: action
    action: element_action
    selector:
      name: ItemViewParent
      role: list
    do: focus
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ControlButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ItemViewParent
      role: list
- id: suite_dde_file_manager_preview_005_s1
  name: 音乐文件预览播放控制与进度滑块验证
  description: 导航到系统声音目录选中音频文件预览，验证播放控制按钮可点击、播放进度滑块与音量滑块可定位、状态栏持续显示
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/sounds
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: PlayControlButton
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: ProgressSlider
      role: slider
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: Slider_2
      role: slider
    do: focus
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: AddressBar
      role: text
  - step_type: assert
    action: assert_element
    selector:
      name: StatusBar
      role: status bar
  - step_type: assert
    action: assert_element
    selector:
      name: PlayControlButton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: ProgressSlider
      role: slider
  - step_type: assert
    action: assert_element
    selector:
      name: Slider_2
      role: slider
- id: suite_dde_file_manager_preview_006_s1
  name: PDF文档预览翻页与未知文件信息显示
  description: 导航到文档目录选中文件预览，验证文件列表视图与下一页按钮可交互，并验证文件大小与类型标签信息正确显示
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/doc
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: View_ImageList
      role: list
    do: focus
  - step_type: action
    action: element_action
    selector:
      name: Nextbutton
      role: push button
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: View_ImageList
      role: list
  - step_type: assert
    action: assert_element
    selector:
      name: Nextbutton
      role: push button
  - step_type: assert
    action: assert_element
    selector:
      name: SizeLabel
      role: label
  - step_type: assert
    action: assert_element
    selector:
      name: TypeLabel
      role: label
- id: suite_dde_file_manager_preview_007_s1
  name: DCI图标预览主题切换验证
  description: 导航到图标资源目录选中DCI图标文件预览，验证主题下拉框可切换主题并验证控件持续可定位
  steps:
  - step_type: action
    action: keyboard_press
    key: ctrl+l
  - step_type: action
    action: element_set_value
    selector:
      name: AddressBar
      role: text
    text: /usr/share/dsg/icons
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: space
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: ThemeCom
      role: combo box
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ThemeCom
      role: combo box
teardown:
- action: session_stop
