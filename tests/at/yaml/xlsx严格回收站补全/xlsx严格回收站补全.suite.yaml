- id: case_1805903
  name: 添加数据到回收站-连续删除重名文件/文件夹
  description: 'xlsx 用例编号: 1805903

    所属模块: /V25_2500（测试部专用）/A类核心模块/文件管理器/主界面区域/固定目录/回收站(#132300)

    前置条件: 文件管理器已启动并处于主目录

    测试步骤:

    1. 在桌面新建文件/文件夹A-选中文件/文件夹A-右键删除

    2. 再次在桌面新建文件/文件夹A-选中文件/文件夹A-右键删除

    3. 再次在桌面新建文件/文件夹A-选中文件/文件夹A-右键删除

    预期结果:

    1. 回收站内文件/文件夹A显示正常（名称、内容）

    2. 回收站内这2个文件/文件夹A显示正常（名称、内容）

    3. 回收站内这3个文件/文件夹A显示正常（名称、内容）

    严格映射说明: 使用家目录下隔离夹具连续三次创建同名文件 `A.txt` 和同名文件夹 `A_dir`，每次用隔离 `XDG_DATA_HOME` 执行 `gio trash`。断言 Trash/files 中保留三份同名删除结果（`A.txt/A.2.txt/A.3.txt` 与 `A_dir/A_dir.2/A_dir.3`），内容分别对应三次删除，Trash/info 中均记录原始路径。该用例证明连续删除重名项目时回收站保留多份结果，不验证桌面右键路径。

    '
  tags: []
  vars:
    xlsx_id: '1805903'
    case_type: 功能测试
  steps:
  - action: session_start
    command: >-
      bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805903"; rm -rf "$base"; mkdir -p "$base/src" "$base/xdg-data"; for n in 1 2 3; do printf "file$n" > "$base/src/A.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/A.txt"; mkdir -p "$base/src/A_dir"; printf "dir$n" > "$base/src/A_dir/nested.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/A_dir"; done'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: >-
      bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805903"; test "$(cat "$base/xdg-data/Trash/files/A.txt")" = "file1"; test "$(cat "$base/xdg-data/Trash/files/A.2.txt")" = "file2"; test "$(cat "$base/xdg-data/Trash/files/A.3.txt")" = "file3"; test "$(cat "$base/xdg-data/Trash/files/A_dir/nested.txt")" = "dir1"; test "$(cat "$base/xdg-data/Trash/files/A_dir.2/nested.txt")" = "dir2"; test "$(cat "$base/xdg-data/Trash/files/A_dir.3/nested.txt")" = "dir3"; for p in A.txt A.2.txt A.3.txt; do test -f "$base/xdg-data/Trash/info/$p.trashinfo"; grep -F "Path=$base/src/A.txt" "$base/xdg-data/Trash/info/$p.trashinfo"; done; for p in A_dir A_dir.2 A_dir.3; do test -f "$base/xdg-data/Trash/info/$p.trashinfo"; grep -F "Path=$base/src/A_dir" "$base/xdg-data/Trash/info/$p.trashinfo"; done'
    wait: 0.3
