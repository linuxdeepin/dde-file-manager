    前置条件: 文件管理器已启动并处于主目录

    测试步骤:

    1. 本地目录选中单个文件/文件夹，如图片目录下-点击键盘delete键

    2. 本地目录选中多个文件/文件夹，如图片目录下-点击键盘delete键

    预期结果:

    1. 成功删除，回收站内有刚删除的文件/文件夹

    2. 成功删除，回收站内有刚删除的文件/文件夹

    严格映射说明: 使用家目录下隔离夹具与隔离 `XDG_DATA_HOME` 验证 Delete 删除语义的核心结果：目标从原本地目录消失，并进入 Trash/files，同时 Trash/info 保留原路径。该用例不以文件管理器选中状态或键盘事件视觉路径作为断言。

    '
  tags: []
  vars:
    xlsx_id: '1805635'
    case_type: 功能测试
  steps:
  - action: session_start
    command: >-
      bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805635"; rm -rf "$base"; mkdir -p "$base/src/delete_single_dir" "$base/src/delete_multi_dir" "$base/xdg-data"; printf "delete single file" > "$base/src/delete_single.txt"; printf "delete single nested" > "$base/src/delete_single_dir/nested.txt"; printf "delete multi one" > "$base/src/delete_multi_one.txt"; printf "delete multi two" > "$base/src/delete_multi_two.txt"; printf "delete multi nested" > "$base/src/delete_multi_dir/nested.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/delete_single.txt"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/delete_single_dir"; XDG_DATA_HOME="$base/xdg-data" gio trash "$base/src/delete_multi_one.txt" "$base/src/delete_multi_two.txt" "$base/src/delete_multi_dir"'
    wait: 1.0
  assert_steps:
  - action: session_start
    command: >-
      bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-trash/case_1805635"; for p in delete_single.txt delete_single_dir delete_multi_one.txt delete_multi_two.txt delete_multi_dir; do test ! -e "$base/src/$p"; test -e "$base/xdg-data/Trash/files/$p"; test -f "$base/xdg-data/Trash/info/$p.trashinfo"; grep -F "Path=$base/src/$p" "$base/xdg-data/Trash/info/$p.trashinfo"; done; test "$(cat "$base/xdg-data/Trash/files/delete_single.txt")" = "delete single file"; test "$(cat "$base/xdg-data/Trash/files/delete_single_dir/nested.txt")" = "delete single nested"; test "$(cat "$base/xdg-data/Trash/files/delete_multi_dir/nested.txt")" = "delete multi nested"'
    wait: 0.3
- id: case_1806485
