# ── 智能语义搜索：位置与属性槽语义搜索（5 个原始 ID）──
# 2018851, 2018925, 2019159, 2019751, 2019753
- id: case_2018851
  name: 【智能语义搜索】位置与属性槽语义搜索_目录与大小
  description: 'xlsx 用例编号: 2018851, 2018925, 2019159, 2019751, 2019753'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '2018851'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_2018851; rm -rf "$base"; mkdir -p "$base/Downloads" "$base/WeChat";
      printf small > "$base/Downloads/small.txt";
      dd if=/dev/zero of="$base/Downloads/big.bin" bs=1M count=2 status=none;
      printf msg > "$base/WeChat/received.txt";
      rm -f "$base/PASS_2018851";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_2018851.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_type
    text: 下载目录的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 下载里的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 微信接受的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 微信里接收的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 大于1M
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 1M以内
    wait: 3.0
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx语义搜索场景化/assert_semantic_search.py
      /tmp/dde-at-fixtures/case_2018851/PASS_2018851
      mixed
      /tmp/dde-at-fixtures/case_2018851/Downloads/small.txt:exists:
      /tmp/dde-at-fixtures/case_2018851/Downloads/big.bin:size_gt:1048576
      /tmp/dde-at-fixtures/case_2018851/WeChat/received.txt:exists:
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_2018851/PASS_2018851
# ── 智能语义搜索：行为槽与索引配置（4 个原始 ID）──
# 2018695, 2018697, 2018747, 2019687
- id: case_2018695
  name: 【智能语义搜索】行为槽与索引配置_创建行为与提示语
  description: 'xlsx 用例编号: 2018695, 2018697, 2018747, 2019687'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '2018695'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_2018695; rm -rf "$base"; mkdir -p "$base";
      printf content > "$base/new_file.txt";
      printf content > "$base/saved_file.txt";
      printf content > "$base/stored_file.txt";
      dde-dconfig --get -a org.deepin.dde.file-manager -r org.deepin.dde.file-manager.search -k enableFileIndexSearch >/tmp/dfm_at_2018695_idx_backup.txt 2>/dev/null || printf "__unset__" >/tmp/dfm_at_2018695_idx_backup.txt;
      dde-dconfig --set -a org.deepin.dde.file-manager -r org.deepin.dde.file-manager.search -k enableFileIndexSearch -v true >/tmp/dfm_at_2018695_dconfig.log 2>&1 || true;
      rm -f "$base/PASS_2018695";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_2018695.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_type
    text: 新建的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 保存的文件
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 存下来的文件
    wait: 3.0
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx语义搜索场景化/assert_semantic_search.py
      /tmp/dde-at-fixtures/case_2018695/PASS_2018695
      exists
      /tmp/dde-at-fixtures/case_2018695/new_file.txt
      /tmp/dde-at-fixtures/case_2018695/saved_file.txt
      /tmp/dde-at-fixtures/case_2018695/stored_file.txt
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_2018695/PASS_2018695
