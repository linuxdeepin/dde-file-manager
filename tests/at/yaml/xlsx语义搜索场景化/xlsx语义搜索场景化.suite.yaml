name: xlsx语义搜索场景化_suite
app: dde-file-manager
description: >-
  场景化补全——将智能语义搜索 44 个弱覆盖入口烟测用例强化为真实功能操作+业务结果断言，
  覆盖时间槽语义搜索（24 ID）、类型与关键词槽语义搜索（11 ID）、位置与属性槽语义搜索（5 ID）、
  行为槽与索引配置语义搜索（4 ID）四个子主题。
module: xlsx语义搜索场景化
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 智能语义搜索：时间槽语义搜索（24 个原始 ID）──
# 2018701, 2018703, 2018705, 2018713, 2018721, 2018723,
# 2021285, 2021287, 2021289, 2021291, 2021293, 2021295,
# 2021297, 2021299, 2021301, 2021307, 2021309, 2021311,
# 2021313, 2021315, 2021317, 2021319, 2023303, 2023317
- id: case_2018701
  name: 【智能语义搜索】时间槽语义搜索_单时间词与泛化词
  description: >-
    xlsx 用例编号: 2018701, 2018703, 2018705, 2018713, 2018721, 2018723,
    2021285, 2021287, 2021289, 2021291, 2021293, 2021295,
    2021297, 2021299, 2021301, 2021307, 2021309, 2021311,
    2021313, 2021315, 2021317, 2021319, 2023303, 2023317
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '2018701'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_2018701; rm -rf "$base"; mkdir -p "$base";
      touch -t 202512150000 "$base/last_dec_table.xlsx";
      touch -t 202512150000 "$base/last_year_table.xlsx";
      touch -t 202609270000 "$base/yesterday_doc.txt";
      touch -t 202609260000 "$base/day_before_yesterday_doc.txt";
      touch -t 202609210000 "$base/last_week_doc.txt";
      touch -t 202609010000 "$base/this_month_doc.txt";
      touch -t 202601010000 "$base/this_year_doc.txt";
      rm -f "$base/PASS_2018701";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_2018701.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+f
    wait: 1.0
  - action: element_action
    ref: SearchLineEdit
    do: click
    wait: 0.5
  - action: keyboard_type
    text: 去年12月创建的表格
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 上一年创建的表格
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 昨天创建的文档
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 昨日创建的文档
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 前天创建的文档
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 上周创建的文档
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 本月创建的文档
    wait: 3.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_type
    text: 今年创建的文档
    wait: 3.0
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx语义搜索场景化/assert_semantic_search.py
      /tmp/dde-at-fixtures/case_2018701/PASS_2018701
      mixed
      /tmp/dde-at-fixtures/case_2018701/last_dec_table.xlsx:ts:202512150000
      /tmp/dde-at-fixtures/case_2018701/last_year_table.xlsx:ts:202512150000
      /tmp/dde-at-fixtures/case_2018701/yesterday_doc.txt:ts:202609270000
      /tmp/dde-at-fixtures/case_2018701/day_before_yesterday_doc.txt:ts:202609260000
      /tmp/dde-at-fixtures/case_2018701/last_week_doc.txt:ts:202609210000
      /tmp/dde-at-fixtures/case_2018701/this_month_doc.txt:ts:202609010000
      /tmp/dde-at-fixtures/case_2018701/this_year_doc.txt:ts:202601010000
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_2018701/PASS_2018701
