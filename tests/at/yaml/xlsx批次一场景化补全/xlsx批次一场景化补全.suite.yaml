name: xlsx批次一场景化补全_suite
app: dde-file-manager
description: >-
  批次一剩余 P1/P2 主题场景化补全——将回收站表头与内容展示、V25设计改版标签页与文件属性、
  标签页右键固定、文件粉碎、清理空间后删除、文件属性隐藏与可执行、视图与标签页冒烟、
  回收站无内容页面、桌面整理集合方式 9 个主题块（19 个原始 ID）从入口烟测强化为
  真实功能操作+业务结果断言。
module: xlsx批次一场景化补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 回收站：表头与内容展示（3 个原始 ID）──
# 1805669, 1805671, 1805783
- id: case_1805669
  name: 【回收站】回收站表头与内容展示
  description: 'xlsx 用例编号: 1805669, 1805671, 1805783；打开回收站验证表头显示与内容滚动，拖拽文件到文件夹。'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '1805669'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1805669; rm -rf "$base"; mkdir -p "$base/target_folder";
      printf "recycled file 1" > "$base/trash_file_1.txt";
      printf "recycled file 2" > "$base/trash_file_2.txt";
      gio trash "$base/trash_file_1.txt" "$base/trash_file_2.txt" 2>/dev/null || true;
      rm -f "$base/PASS_1805669";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager trash:/// >/tmp/dfm_at_1805669.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: element_action
    ref: 回收站
    do: click
    wait: 1.0
  - action: keyboard_hot_key
    key: End
    wait: 0.5
  - action: keyboard_hot_key
    key: Home
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次一场景化补全/assert_batch1.py
      /tmp/dde-at-fixtures/case_1805669/PASS_1805669
      trash_contains
      trash_file_1.txt
      trash_file_2.txt
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1805669/PASS_1805669
