# ── 文件粉碎冒烟：非虚拟目录（1 个原始 ID）──
# 1924527
- id: case_1924527
  name: 【2500U1需求】文件粉碎冒烟_非虚拟目录
  description: 'xlsx 用例编号: 1924527；在普通目录选中文件执行粉碎（Shift+Delete 永久删除），验证文件被彻底粉碎不在回收站。'
  tags:
  - P1-1
  - strict
  vars: {xlsx_id: '1924527'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1924527; rm -rf "$base"; mkdir -p "$base";
      printf "sensitive data to shred" > "$base/shred_me.txt";
      rm -f "$base/PASS_1924527";
      gio trash --empty 2>/dev/null || true;
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_1924527.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_hot_key
    key: shift+Delete
    wait: 2.0
  - action: keyboard_hot_key
    key: Return
    wait: 1.0
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次一场景化补全/assert_batch1.py
      /tmp/dde-at-fixtures/case_1924527/PASS_1924527
      mixed
      /tmp/dde-at-fixtures/case_1924527/shred_me.txt:not_exists:
      shred_me.txt:trash_not_contains:
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1924527/PASS_1924527
# ── 清理空间后再删除文件（1 个原始 ID）──
# 1942341
- id: case_1942341
  name: 【2500U1需求】清理空间后再删除文件
  description: 'xlsx 用例编号: 1942341；释放空间后再次删除文件，验证删除成功。'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '1942341'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1942341; rm -rf "$base"; mkdir -p "$base";
      printf "file to delete after space cleanup" > "$base/target_file.txt";
      avail=$(df --output=avail -B1 /tmp | tail -1 | tr -d " ");
      test "$avail" -gt 0;
      rm -f "$base/PASS_1942341";
