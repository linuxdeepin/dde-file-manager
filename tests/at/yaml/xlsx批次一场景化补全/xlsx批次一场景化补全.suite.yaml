      dde-file-manager "$base" >/tmp/dfm_at_1942341.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_hot_key
    key: Delete
    wait: 2.0
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次一场景化补全/assert_batch1.py
      /tmp/dde-at-fixtures/case_1942341/PASS_1942341
      trash_contains
      target_file.txt
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1942341/PASS_1942341
