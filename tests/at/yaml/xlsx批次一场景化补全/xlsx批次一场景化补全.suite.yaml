name: xlsx批次一场景化补全_suite
app: dde-file-manager
description: >-
  新基线适用且本地通过的批次一场景化补全，覆盖回收站、V25设计改版、标签页固定、
  文件粉碎、视图与标签页、回收站空页面 6 个主题块（8 个原始 ID）。
module: xlsx批次一场景化补全
tags:
- strict
fast_fail: false
env_check: []
setup: []
suites:
# ── 回收站：表头与内容展示（3 个原始 ID）──
# 1805669, 1805671, 1805783
- id: case_1805669
  name: 【回收站】回收站表头与内容展示
  description: 'xlsx 用例编号: 1805669, 1805783；打开回收站验证表头显示与内容滚动，拖拽文件到文件夹。'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '1805669'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/case_1805669"; rm -rf "$base"; mkdir -p "$base/target_folder";
      printf "recycled file 1" > "$base/trash_file_1.txt";
      printf "recycled file 2" > "$base/trash_file_2.txt";
      gio trash "$base/trash_file_1.txt" "$base/trash_file_2.txt" 2>/dev/null || true;
      rm -f /tmp/dde-at-fixtures/case_1805669/PASS_1805669;
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager trash:/// >/tmp/dfm_at_1805669.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: element_action
    ref: 回收站
    do: click
    wait: 1.0
  - action: keyboard_hot_key
    key: End
    wait: 0.5
  - action: keyboard_hot_key
    key: Home
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次一场景化补全/assert_batch1.py
      /tmp/dde-at-fixtures/case_1805669/PASS_1805669
      trash_contains
      trash_file_1.txt
      trash_file_2.txt
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1805669/PASS_1805669
# ── V25设计改版：标签页与文件属性（5 个原始 ID）──
# 1816715, 1816731, 1816733, 1816735, 1873489
- id: case_1816715
  name: 【V25设计改版】标签页与文件属性_V25改版展示
  description: 'xlsx 用例编号: 1816715；查看标签页位置、激活已打开标签页、查看图片/视频/音乐扩展属性。'
  tags:
  - P2-1
  - strict
  vars: {xlsx_id: '1816715'}
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; base=/tmp/dde-at-fixtures/case_1816715; rm -rf "$base"; mkdir -p "$base";
      printf "fake jpg" > "$base/sample_photo.jpg";
      printf "fake mp4" > "$base/sample_video.mp4";
      printf "fake mp3" > "$base/sample_music.mp3";
      rm -f "$base/PASS_1816715";
      pkill -9 -f "^/usr/libexec/dde-file-manager( |$)" 2>/dev/null || true;
      dde-file-manager "$base" >/tmp/dfm_at_1816715.log 2>&1 & sleep 5;
      xdotool search --class dde-file-manager windowactivate %@ windowsize %@ 1200 700'
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+t
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+w
    wait: 1.0
  - action: keyboard_hot_key
    key: ctrl+a
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+i
    wait: 2.0
  - action: keyboard_hot_key
    key: Escape
    wait: 0.5
  assert_steps:
  - action: session_start
    command: >-
      python3 tests/at/yaml/xlsx批次一场景化补全/assert_batch1.py
      /tmp/dde-at-fixtures/case_1816715/PASS_1816715
      exists
      /tmp/dde-at-fixtures/case_1816715/sample_photo.jpg
      /tmp/dde-at-fixtures/case_1816715/sample_video.mp4
      /tmp/dde-at-fixtures/case_1816715/sample_music.mp3
    wait: 1.0
  - action: assert_file_exists
    path: /tmp/dde-at-fixtures/case_1816715/PASS_1816715
