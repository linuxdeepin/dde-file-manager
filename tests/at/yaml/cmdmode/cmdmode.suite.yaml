name: 命令方式_suite
app: dde-file-manager
description: 命令方式模块 AT-SPI 用例
module: 命令方式
tags: []
fast_fail: false
env_check: []
setup: []
suites:
- id: case_cmdmode_命令方式_001
  name: dde-file-manager -p 显示文件属性对话框_
  description: '来源用例编号: 1805557'
  tags: []
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
  - action: element_action
    ref: side_bar_view
    do: focus
    wait: 1.0
  assert_steps:
  - action: assert_process_running
    app: dde-file-manager
  - action: assert_element
    ref: 系统盘
  - action: assert_element
    ref: 计算机
