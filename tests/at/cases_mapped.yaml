version: '1.0'
cases:
- id: case_bug_sidebar_navigate_system
  name: 侧边栏系统导航——计算机到桌面到最近使用
  module: bug转用例场景
  steps:
  - action: session_start
    command: dde-file-manager --open-home
    wait: 5.0
    step_type: action
  - action: element_action
    ref: 计算机
    do: click
    wait: 1.0
    step_type: action
  - action: element_action
    ref: 桌面
    do: click
    wait: 1.0
    step_type: action
  - action: element_action
    ref: 最近使用
    do: click
    wait: 1.0
    step_type: action
  - action: assert_element
    ref: 计算机
    step_type: assert
  - action: assert_element
    ref: 桌面
    step_type: assert
  - action: assert_element
    ref: 最近使用
    step_type: assert
