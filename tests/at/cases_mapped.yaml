  - id: "fm_menu_new_window"
    name: 主菜单新建窗口
    module: 菜单操作
    status: active
    annotation:
      测试界面: "主窗口-标题栏"
      测试功能: "通过标题栏主菜单新建窗口"
      前置条件: "dde-file-manager 已启动并显示主窗口"
      AT元素引用: ["新建窗口"]
    steps:
      - step_type: "action"
        description: "启动 dde-file-manager"
        action: "session_start"
        command: "true; dde-file-manager --open-home"
      - step_type: "action"
        description: "打开标题栏主菜单并选择新建窗口"
        action: "dtk_main_menu"
        items: ["新建窗口"]
      - step_type: "assert"
        description: "验证出现文件管理器窗口"
        action: "assert_window"
        selector:
          name_pattern: "dde-file-manager"
      - step_type: "assert"
        description: "验证文件管理器进程运行"
        action: "assert_process_running"
        text: "dde-file-manager"

