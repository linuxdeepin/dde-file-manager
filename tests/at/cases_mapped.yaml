- id: case_1850169
  name: 文件名最大长度不小于255字节
  module: xlsx严格压缩补全
  steps:
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/strict-archive/case_1850169;
      rm -rf "$base"; mkdir -p "$base/src" "$base/out"; file_name="$(printf "a%.0s"
      {1..251}).txt"; dir_name="$(printf "b%.0s" {1..255})"; test ${#file_name} -eq
      255; test ${#dir_name} -eq 255; printf "long file payload" > "$base/src/$file_name";
      mkdir "$base/src/$dir_name"; printf "long dir payload" > "$base/src/$dir_name/nested.txt";
      (cd "$base/src" && zip -qr "$base/longnames.zip" "$file_name" "$dir_name");
      unzip -Z1 "$base/longnames.zip" > "$base/listing.txt"; unzip -q "$base/longnames.zip"
      -d "$base/out"'
    wait: 1.0
  - action: session_start
    command: bash -lc 'set -e; base=/tmp/dde-at-fixtures/strict-archive/case_1850169;
      file_name="$(printf "a%.0s" {1..251}).txt"; dir_name="$(printf "b%.0s" {1..255})";
      grep -Fx "$file_name" "$base/listing.txt"; grep -Fx "$dir_name/" "$base/listing.txt";
      test "$(cat "$base/out/$file_name")" = "long file payload"; test "$(cat "$base/out/$dir_name/nested.txt")"
      = "long dir payload"; test ${#file_name} -eq 255; test ${#dir_name} -eq 255'
    wait: 0.3
- id: case_1850163
  name: 文件右键-复制粘贴、剪切粘贴、删除、重命名、压缩
  module: xlsx严格压缩补全
  steps:
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-file-ops/case_1850163";
      rm -rf "$base"; mkdir -p "$base/testdir" "$base/desktop" "$base/archive-out"
      "$base/xdg-data"; printf "copy" > "$base/testdir/copy.txt"; printf "cut" > "$base/testdir/cut.txt";
      printf "delete" > "$base/testdir/delete.txt"; printf "rename" > "$base/testdir/rename.txt";
      printf "archive-a" > "$base/testdir/archive_a.txt"; mkdir "$base/testdir/archive_dir";
      printf "archive-b" > "$base/testdir/archive_dir/archive_b.txt"; cp "$base/testdir/copy.txt"
      "$base/desktop/copy.txt"; mv "$base/testdir/cut.txt" "$base/desktop/cut.txt";
      XDG_DATA_HOME="$base/xdg-data" gio trash "$base/testdir/delete.txt"; mv "$base/testdir/rename.txt"
      "$base/testdir/renamed.txt"; (cd "$base/testdir" && zip -qr "$base/archive-out/files.zip"
      archive_a.txt archive_dir); unzip -q "$base/archive-out/files.zip" -d "$base/archive-out/unzipped"'
    wait: 1.0
  - action: session_start
    command: bash -lc 'set -e; base="$HOME/.cache/dde-at-fixtures/strict-file-ops/case_1850163";
      test "$(cat "$base/desktop/copy.txt")" = "copy"; test -f "$base/testdir/copy.txt";
      test ! -e "$base/testdir/cut.txt"; test "$(cat "$base/desktop/cut.txt")" = "cut";
      test ! -e "$base/testdir/delete.txt"; test "$(cat "$base/xdg-data/Trash/files/delete.txt")"
      = "delete"; test -f "$base/xdg-data/Trash/info/delete.txt.trashinfo"; grep -F
      "Path=$base/testdir/delete.txt" "$base/xdg-data/Trash/info/delete.txt.trashinfo";
      test ! -e "$base/testdir/rename.txt"; test "$(cat "$base/testdir/renamed.txt")"
      = "rename"; test "$(cat "$base/archive-out/unzipped/archive_a.txt")" = "archive-a";
      test "$(cat "$base/archive-out/unzipped/archive_dir/archive_b.txt")" = "archive-b"'
    wait: 0.3
