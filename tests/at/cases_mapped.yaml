# === 格式范例 ===
# cases_mapped.yaml — AT-SPI 测试用例映射文件
# 格式: cases 列表，每条用例包含 id, name, module, steps, annotation
# annotation 字段包含: 测试界面, 测试功能, 前置条件, AT元素引用
