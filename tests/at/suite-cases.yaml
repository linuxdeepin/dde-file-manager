    测试功能: 通过标题栏主菜单在当前窗口新建标签页
    前置条件: dde-file-manager 已启动并显示主窗口
    AT元素引用:
    - 新建标签
  steps:
  - step_type: action
    description: 启动 dde-file-manager
  - step_type: action
    description: 打开标题栏主菜单并选择新建标签
  - step_type: assert
    description: 验证文件管理器进程运行
