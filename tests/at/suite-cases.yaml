# 用例规范化产物，按 GUI 界面分组，每 suite 含 4 字段注释与原子化步骤描述。
# 继续补全（查漏补缺）后更新。
cases:
- id: fm_menu_new_window
  name: 主菜单新建窗口
  status: active
  annotation:
    测试界面: 主窗口-标题栏
    测试功能: 通过标题栏主菜单新建窗口
    前置条件: dde-file-manager 已启动并显示主窗口
    AT元素引用:
    - 新建窗口
  steps:
  - step_type: action
    description: 启动 dde-file-manager
  - step_type: action
    description: 打开标题栏主菜单并选择新建窗口
  - step_type: assert
    description: 验证出现文件管理器窗口
  - step_type: assert
    description: 验证文件管理器进程运行
- id: fm_menu_new_tab
  name: 主菜单新建标签
  status: active
  annotation:
